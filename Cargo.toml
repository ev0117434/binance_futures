[package]
name = "binance_futures_writer"
version = "0.1.0"
edition = "2021"

[dependencies]
memmap2 = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = "1"
futures-util = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
